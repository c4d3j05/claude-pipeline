[project]
name = "claude-pipeline"
version = "0.1.0"
description = "Turn Vikunja tasks into reviewed pull requests with unattended Claude Code workers — one worker per task, N in parallel on one Mac."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
claude-pipeline = "dispatcher.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
dashboard = [
    "textual>=0.60",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1510: we inspect returncode manually instead of check=True (workers must not raise).
# DTZ005/DTZ011: the cost ledger is keyed on the operator's local calendar day, by design.
ignore = ["PLW1510", "DTZ005", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatcher"]
